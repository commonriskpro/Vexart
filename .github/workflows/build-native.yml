name: build-native

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            platform-tag: darwin-arm64
            lib-name: libvexart.dylib
            npm-os: darwin
            npm-cpu: arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform-tag: linux-x64
            lib-name: libvexart.so
            npm-os: linux
            npm-cpu: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform-tag: linux-arm64
            lib-name: libvexart.so
            npm-os: linux
            npm-cpu: arm64

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform-tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_version
        run: |
          set -euo pipefail
          version="$(node scripts/release-verification.mjs version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Test release verification helpers
        run: node --test scripts/release-verification.test.mjs

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build libvexart (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package platform artifact
        env:
          VEXART_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifact
          cp target/${{ matrix.target }}/release/${{ matrix.lib-name }} artifact/
          cp LICENSE artifact/LICENSE
          cat > artifact/package.json << PKGJSON
          {
            "name": "@vexart-native/${{ matrix.platform-tag }}",
            "version": "${VEXART_VERSION}",
            "description": "Vexart native binary for ${{ matrix.platform-tag }}",
            "type": "module",
            "os": ["${{ matrix.npm-os }}"],
            "cpu": ["${{ matrix.npm-cpu }}"],
            "files": ["${{ matrix.lib-name }}", "LICENSE"],
            "license": "SEE LICENSE IN LICENSE"
          }
          PKGJSON

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform-tag }}
          path: artifact/

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_version
        run: |
          set -euo pipefail
          version="$(node scripts/release-verification.mjs version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts/

      - name: Build dist
        run: VEXART_ALLOW_NO_NATIVE=1 bun run build:dist
        env:
          VEXART_ALLOW_NO_NATIVE: "1"

      - name: Place native binaries into dist
        run: |
          set -euo pipefail
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            mkdir -p dist/platform/$platform
            cp native-artifacts/native-$platform/* dist/platform/$platform/
          done

      - name: Validate release metadata and artifacts
        env:
          VEXART_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          node scripts/release-verification.mjs artifacts "$VEXART_VERSION"

      - name: Publish platform packages
        run: |
          set -euo pipefail
          for platform in darwin-arm64 linux-x64 linux-arm64; do
            echo "Publishing @vexart-native/$platform..."
            (cd "dist/platform/$platform" && npm publish --access public --tag latest)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish vexart
        run: |
          set -euo pipefail
          cd dist
          npm publish --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package versions and dist-tags
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VEXART_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          attempts=6
          delay_seconds=10
          for ((attempt=1; attempt<=attempts; attempt++)); do
            set +e
            node scripts/release-verification.mjs registry "$VEXART_VERSION"
            status=$?
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            if [[ "$status" -ne 2 ]]; then
              echo "Registry verification failed permanently; no republish will be attempted." >&2
              exit "$status"
            fi
            if [[ "$attempt" -lt "$attempts" ]]; then
              echo "Registry propagation pending (attempt $attempt/$attempts); waiting ${delay_seconds}s..."
              sleep "$delay_seconds"
            fi
          done
          echo "Registry propagation did not complete within the bounded verification window." >&2
          exit 1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native-artifacts/native-darwin-arm64/libvexart.dylib
            native-artifacts/native-linux-x64/libvexart.so
            native-artifacts/native-linux-arm64/libvexart.so
          generate_release_notes: true
          prerelease: ${{ contains(steps.release_version.outputs.version, '-') }}
