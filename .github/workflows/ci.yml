name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  pr-lint:
    name: Conventional Commits Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR Title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PATTERN: '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_\-\./]+\))?(!)?:\s.+$'
        run: |
          VALID=0
          if command -v node >/dev/null 2>&1; then
            if node -e '
              const title = process.env.PR_TITLE || "";
              const pattern = new RegExp(process.env.PATTERN);
              process.exit(pattern.test(title) ? 0 : 1);
            '; then
              VALID=1
            fi
          elif [[ "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?(!)?:[[:space:]].+$ ]]; then
            VALID=1
          fi

          if [ "$VALID" -ne 1 ]; then
            echo "::error::❌ Pull Request title does not follow Conventional Commits!"
            echo "::error::Format: <type>(<scope>): <description>"
            echo "::error::Example: fix(engine): fix memory leak in shm transport"
            echo "::error::Allowed types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert"
            exit 1
          fi
          echo "✅ PR title follows Conventional Commits: $PR_TITLE"

  typecheck:
    name: TypeScript & Architecture
    needs: [pr-lint]
    if: always() && (needs.pr-lint.result == 'success' || needs.pr-lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: TypeScript Typecheck
        run: bun run typecheck

      - name: Verify Generated Types & API Freshness
        run: bun run types:check

      - name: Architectural Boundaries Lint
        run: bun run lint:boundaries

  dist-smoke:
    name: Distribution Bundle & Dual Barrel Smoke
    needs: [pr-lint]
    if: always() && (needs.pr-lint.result == 'success' || needs.pr-lint.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS deps
        run: bun install --frozen-lockfile

      - name: Build Distribution Bundle
        run: VEXART_ALLOW_NO_NATIVE=1 bun run build:dist
        env:
          VEXART_ALLOW_NO_NATIVE: "1"

      - name: Dual-Barrel Universal Reconciler Test
        run: bun --conditions=browser test --preload ./solid-plugin.ts scripts/consumer/dual-barrel.test.ts

      - name: Consumer Types Smoke Test
        run: bunx tsc --noEmit --strict scripts/consumer/types-smoke.ts
